name: Build Axiom OS ISO

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup

      - name: Install ISO Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            initramfs-tools \
            qemu-utils

      - name: Make build script executable
        run: chmod +x scripts/build_axiom.sh

      - name: Execute ISO Build
        run: |
          sudo -E ./scripts/build_axiom.sh

      - name: Verify ISO Artifact Output
        run: |
          if [ ! -f output/AxiomOS.iso ]; then
            echo "Error: output/AxiomOS.iso was not generated!"
            exit 1
          fi
          ls -lh output/AxiomOS.iso

      - name: Upload ISO to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AxiomOS-ISO
          path: output/AxiomOS.iso
          retention-days: 7
